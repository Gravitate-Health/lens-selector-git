# Default values for lens-selector-git
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/gravitate-health/lens-selector-git
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 3000
  # Additional labels for the service (required for service discovery)
  labels:
    eu.gravitate-health.fosps.focusing: "true"

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Application configuration
config:
  # Repository configuration
  # Multi-repository mode (recommended)
  reposConfig: "https://raw.githubusercontent.com/Gravitate-Health/gravitate-health.github.io/refs/heads/main/lenses.oficial.json"
  
  # Legacy single repository mode (optional, can be used in combination with reposConfig)
  gitRepoUrl: ""
  gitBranch: "main"
  lensFilePath: ""
  
  # Service configuration
  port: 3000
  
  # Cache time-to-live in minutes
  # Set to -1 for infinite cache (recommended for tagged releases)
  cacheTtlMinutes: 5
  
  # Temporary directory for cloned repositories (optional)
  lensReposTempDir: ""

# Secrets configuration (values should be provided via separate secure means)
secrets:
  # Add any sensitive configuration here
  # Values should be overridden in production using --set or a separate secure values file
  {}
